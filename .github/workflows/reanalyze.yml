name: Reanalyze Articles

# 手動実行専用。定期実行スケジュールは持たない。
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "1回の実行で処理する件数の上限（トークン節約のため既定は少なめ）"
        required: true
        default: "10"
        type: string
      batch_size:
        description: "バッチ1回あたりの記事数（まとめてAPIに送る件数）"
        required: true
        default: "5"
        type: string

permissions:
  contents: write

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      # reanalyze.py の実行 → commit/push の順序は厳守（逆順にすると反映されない）
      - name: Run reanalyze.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          REANALYZE_LIMIT: ${{ github.event.inputs.limit || '10' }}
          REANALYZE_BATCH_SIZE: ${{ github.event.inputs.batch_size || '5' }}
        run: python scripts/reanalyze.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data/news.json docs/data/entities.json
          git diff --cached --quiet || git commit -m "chore: reanalyze articles"
          git push
